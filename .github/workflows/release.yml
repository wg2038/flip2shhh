name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Materialize keystore.properties and the signing keystore from repo secrets.
      # Skipped when secrets are absent (fork builds), which keeps the debug signing
      # fallback from app/build.gradle.kts intact.
      - name: Restore release signing keystore
        env:
          FLIP2SHHH_KEYSTORE_BASE64: ${{ secrets.FLIP2SHHH_KEYSTORE_BASE64 }}
          FLIP2SHHH_KEYSTORE_PASSWORD: ${{ secrets.FLIP2SHHH_KEYSTORE_PASSWORD }}
          FLIP2SHHH_KEY_ALIAS: ${{ secrets.FLIP2SHHH_KEY_ALIAS }}
          FLIP2SHHH_KEY_PASSWORD: ${{ secrets.FLIP2SHHH_KEY_PASSWORD }}
        run: |
          if [ -z "$FLIP2SHHH_KEYSTORE_BASE64" ]; then
            echo "Signing secrets not configured; falling back to debug signing."
            exit 0
          fi
          echo "storeFile=flip2shhh-release.jks" > keystore.properties
          echo "storePassword=$FLIP2SHHH_KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$FLIP2SHHH_KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$FLIP2SHHH_KEY_PASSWORD" >> keystore.properties
          echo "$FLIP2SHHH_KEYSTORE_BASE64" | base64 --decode > flip2shhh-release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/flip2shhh-${GITHUB_REF_NAME}-release.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
